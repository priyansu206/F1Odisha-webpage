<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="F1 Odisha — from the Temple City to the Grid">
  <!-- Carbon base -->
  <rect width="1600" height="900" fill="#15151E"/>

  <!-- Faint engineering grid -->
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <path d="M0 100h1600M0 200h1600M0 300h1600M0 400h1600M0 500h1600M0 600h1600M0 700h1600M0 800h1600"/>
    <path d="M100 0v900M200 0v900M300 0v900M400 0v900M500 0v900M600 0v900M700 0v900M800 0v900M900 0v900M1000 0v900M1100 0v900M1200 0v900M1300 0v900M1400 0v900M1500 0v900"/>
  </g>

  <!-- Diagonal red wedge, right side -->
  <polygon points="1080,0 1600,0 1600,900 860,900" fill="#E10600"/>

  <!-- Carbon-2 offset slab behind the wedge -->
  <polygon points="1120,0 1600,0 1600,900 1010,900" fill="#1E1E2A" opacity="0.55"/>

  <!-- Speed streaks -->
  <g fill="#ffffff" opacity="0.14">
    <rect x="120" y="120" width="220" height="10" transform="skewX(-14)"/>
    <rect x="240" y="210" width="320" height="7" transform="skewX(-14)"/>
    <rect x="60" y="330" width="180" height="6" transform="skewX(-14)"/>
    <rect x="330" y="60" width="150" height="5" transform="skewX(-14)"/>
  </g>

  <!-- Giant outline wordmark watermark -->
  <g transform="translate(1330 585)" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" text-anchor="middle">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="230" font-weight="900" letter-spacing="-6">F1</text>
    <text x="0" y="90" font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="900" letter-spacing="14">ODISHA</text>
  </g>

  <!-- Track center line motif -->
  <path d="M0 470 H1600" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <path d="M0 472 H1600" stroke="#E10600" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="40 24"/>

  <!-- Red live dot + pulse ring -->
  <g transform="translate(150 150)">
    <rect width="14" height="14" fill="#E10600"/>
    <rect x="24" y="2" width="150" height="10" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Bottom checker strip -->
  <g>
    <rect y="884" width="1600" height="16" fill="#0D0D13"/>
    <g fill="#ffffff">
      <rect x="0"   y="884" width="8"  height="8"/>
      <rect x="16"  y="884" width="8"  height="8"/>
      <rect x="32"  y="884" width="8"  height="8"/>
      <rect x="48"  y="884" width="8"  height="8"/>
      <rect x="64"  y="884" width="8"  height="8"/>
      <rect x="80"  y="884" width="8"  height="8"/>
      <rect x="96"  y="884" width="8"  height="8"/>
      <rect x="112" y="884" width="8"  height="8"/>
      <rect x="128" y="884" width="8"  height="8"/>
      <rect x="144" y="884" width="8"  height="8"/>
      <rect x="160" y="884" width="8"  height="8"/>
      <rect x="176" y="884" width="8"  height="8"/>
      <rect x="192" y="884" width="8"  height="8"/>
      <rect x="208" y="884" width="8"  height="8"/>
      <rect x="224" y="884" width="8"  height="8"/>
      <rect x="240" y="884" width="8"  height="8"/>
      <rect x="256" y="884" width="8"  height="8"/>
      <rect x="272" y="884" width="8"  height="8"/>
      <rect x="288" y="884" width="8"  height="8"/>
      <rect x="304" y="884" width="8"  height="8"/>
      <rect x="320" y="884" width="8"  height="8"/>
      <rect x="336" y="884" width="8"  height="8"/>
      <rect x="352" y="884" width="8"  height="8"/>
      <rect x="368" y="884" width="8"  height="8"/>
      <rect x="384" y="884" width="8"  height="8"/>
      <rect x="400" y="884" width="8"  height="8"/>
      <rect x="416" y="884" width="8"  height="8"/>
      <rect x="432" y="884" width="8"  height="8"/>
      <rect x="448" y="884" width="8"  height="8"/>
      <rect x="464" y="884" width="8"  height="8"/>
      <rect x="480" y="884" width="8"  height="8"/>
      <rect x="496" y="884" width="8"  height="8"/>
      <rect x="512" y="884" width="8"  height="8"/>
    </g>
  </g>
</svg>
